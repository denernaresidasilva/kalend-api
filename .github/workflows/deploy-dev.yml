name: DEV manual version gate (no deployment)

on:
  workflow_dispatch:
    inputs:
      api_sha:
        description: Approved API application commit (40 hex)
        required: true
        type: string
      web_sha:
        description: Approved Web application commit (40 hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kalend-dev-manual-version-gate
  cancel-in-progress: false

jobs:
  verify-inputs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate version references only
        env:
          API_SHA: ${{ inputs.api_sha }}
          WEB_SHA: ${{ inputs.web_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$API_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WEB_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Input syntax valid. No backup, migration, SSH, build or deployment executed."
