# Phase A only: new dedicated identity, root-owned home, /bin/dash non-login shell.
# Require global PermitUserEnvironment=no and safe AcceptEnv; stop rather than change globals.
# Validate support/effective settings with the server's own sshd -t/-T before reload.
Match User kalend_dev_audit
    AuthorizedKeysFile /etc/ssh/kalend-dev-keys/%u
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitUserRC no
    DisableForwarding yes
    PermitTTY no
    ForceCommand /usr/local/libexec/kalend-dev-audit
Match all
